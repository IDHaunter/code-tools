<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Escaper / Unescaper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col p-4 md:p-6 box-border m-0">

    <header class="flex items-center justify-between mb-4 shrink-0">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-indigo-400 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
            JSON Escaper & Unescaper
        </h1>
        <span class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">Stringify / Parse</span>
    </header>

    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 min-h-0">
        
        <div class="flex flex-col gap-3 min-h-0">
            <section class="flex-1 flex flex-col bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-lg min-h-0">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <label for="raw-input" class="text-sm font-medium text-slate-300">Raw JSON / Text</label>
                    <div class="flex items-center gap-2">
                        <button onclick="copyRaw()" id="copy-raw-btn" class="text-xs bg-amber-600 hover:bg-amber-500 text-white px-2.5 py-1 rounded transition-colors flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            Copy
                        </button>
                        <button onclick="clearRaw()" class="text-xs text-slate-400 hover:text-rose-400 transition-colors">Clear</button>
                    </div>
                </div>
                <textarea 
                    id="raw-input" 
                    placeholder="Type or paste JSON here..." 
                    class="flex-1 w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none font-mono text-sm"
                ></textarea>
                <div id="raw-error" class="text-xs text-rose-400 mt-1 h-4 shrink-0"></div>
            </section>
            <button onclick="forceEscape()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg shadow transition-colors shrink-0">
                Escape JSON &rarr;
            </button>
        </div>

        <div class="flex flex-col gap-3 min-h-0">
            <section class="flex-1 flex flex-col bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-lg min-h-0">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <label for="escaped-input" class="text-sm font-medium text-slate-300">Escaped JSON String</label>
                    <div class="flex items-center gap-2">
                        <button onclick="copyEscaped()" id="copy-escaped-btn" class="text-xs bg-amber-600 hover:bg-amber-500 text-white px-2.5 py-1 rounded transition-colors flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            Copy
                        </button>
                        <button onclick="clearEscaped()" class="text-xs text-slate-400 hover:text-rose-400 transition-colors">Clear</button>
                    </div>
                </div>
                <textarea 
                    id="escaped-input" 
                    placeholder="Type or paste escaped string here..." 
                    class="flex-1 w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none font-mono text-sm"
                ></textarea>
                <div id="escaped-error" class="text-xs text-rose-400 mt-1 h-4 shrink-0"></div>
            </section>
            <button onclick="forceUnescape()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg shadow transition-colors shrink-0">
                &larr; Unescape JSON
            </button>
        </div>

    </main>

    <script>
        function forceEscape() {
            const rawEl = document.getElementById('raw-input');
            const escapedEl = document.getElementById('escaped-input');
            const rawErrorEl = document.getElementById('raw-error');
            
            rawErrorEl.textContent = '';
            document.getElementById('escaped-error').textContent = '';

            const val = rawEl.value.trim();
            if (!val) {
                escapedEl.value = '';
                return;
            }

            try {
                let compactStr;
                try {
                    const parsed = JSON.parse(val);
                    compactStr = JSON.stringify(parsed);
                } catch (e) {
                    compactStr = val;
                }
                
                let fullyEscaped = JSON.stringify(compactStr);
                if (fullyEscaped.startsWith('"') && fullyEscaped.endsWith('"')) {
                    fullyEscaped = fullyEscaped.slice(1, -1);
                }

                escapedEl.value = fullyEscaped;
            } catch (e) {
                rawErrorEl.textContent = "Error escaping JSON: " + e.message;
            }
        }

        function forceUnescape() {
            const rawEl = document.getElementById('raw-input');
            const escapedEl = document.getElementById('escaped-input');
            const escapedErrorEl = document.getElementById('escaped-error');
            
            escapedErrorEl.textContent = '';
            document.getElementById('raw-error').textContent = '';

            const val = escapedEl.value.trim();
            if (!val) {
                rawEl.value = '';
                return;
            }

            try {
                let unescapedString = JSON.parse('"' + val + '"');

                try {
                    const parsedObj = JSON.parse(unescapedString);
                    rawEl.value = JSON.stringify(parsedObj, null, 2);
                } catch (err) {
                    rawEl.value = unescapedString;
                }
            } catch (e) {
                escapedErrorEl.textContent = "Invalid escaped string format: " + e.message;
            }
        }

        function clearRaw() {
            document.getElementById('raw-input').value = '';
            document.getElementById('raw-error').textContent = '';
        }

        function clearEscaped() {
            document.getElementById('escaped-input').value = '';
            document.getElementById('escaped-error').textContent = '';
        }

        function copyRaw() {
            const rawEl = document.getElementById('raw-input');
            if (!rawEl.value) return;

            navigator.clipboard.writeText(rawEl.value).then(() => {
                const btn = document.getElementById('copy-raw-btn');
                const originalText = btn.innerHTML;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }).catch(() => {
                alert('Failed to copy');
            });
        }

        function copyEscaped() {
            const escapedEl = document.getElementById('escaped-input');
            if (!escapedEl.value) return;

            navigator.clipboard.writeText(escapedEl.value).then(() => {
                const btn = document.getElementById('copy-escaped-btn');
                const originalText = btn.innerHTML;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }).catch(() => {
                alert('Failed to copy');
            });
        }
    </script>
</body>
</html>
